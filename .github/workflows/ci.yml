name: Spring Boot CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  build-test-deploy:

    runs-on: self-hosted

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn clean test

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Stop old application
        run: |
          if [ -f ~/spring-demo/app.pid ]; then
            kill $(cat ~/spring-demo/app.pid) || true
          fi

      - name: Deploy JAR
        run: |
          mkdir -p ~/spring-demo
          cp target/*.jar ~/spring-demo/app.jar

      - name: Start Spring Boot
        run: |
          cd ~/spring-demo
          nohup java -jar app.jar > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application
        run: sleep 10

      - name: Test deployed application
        run: |
          curl --fail http://localhost:8080/api/students/hello