   name: Spring Boot CI/CD

  on:
    push:
      branches:
        - main

    pull_request:
      branches:
        - main


  jobs:

    # =========================
    # CI - Build and Test
    # =========================
    build-test:

      runs-on: self-hosted

      steps:

        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Java
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: maven

        - name: Build and Test
          run: mvn clean test

        - name: Build JAR
          run: mvn clean package -DskipTests


    # =========================
    # CD - Deploy
    # =========================
    deploy:

      needs: build-test

      if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      runs-on: self-hosted

      steps:

        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Java
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: maven

        - name: Build JAR
          run: mvn clean package -DskipTests


        # =========================
        # Stop old application
        # =========================
        - name: Stop old application
          run: |
            if [ -f /home/ubuntu/spring-demo/app.pid ]; then
              PID=$(cat /home/ubuntu/spring-demo/app.pid)
            
              if kill -0 "$PID" 2>/dev/null; then
                echo "Stopping application with PID: $PID"
                kill "$PID"
                sleep 3
              else
                echo "Application is not running"
              fi
            
              rm -f /home/ubuntu/spring-demo/app.pid
            else
              echo "No previous PID file found"
            fi
        

        # =========================
        # Deploy new JAR
        # =========================
        - name: Deploy JAR
          run: |
            mkdir -p /home/ubuntu/spring-demo
            cp target/*.jar /home/ubuntu/spring-demo/app.jar
            
            echo "JAR deployed successfully"
        

        # =========================
        # Start Spring Boot
        # =========================
        - name: Start Spring Boot
          run: |
            cd /home/ubuntu/spring-demo
            
            nohup java -jar app.jar > app.log 2>&1 &
            
            echo $! > app.pid
            
            echo "Application started with PID: $(cat app.pid)"
        

        # =========================
        # Wait for application
        # =========================
        - name: Wait for application
          run: |
            echo "Waiting for Spring Boot to start..."
            sleep 10
        

        # =========================
        # Check application process
        # =========================
        - name: Check application process
          run: |
            PID=$(cat /home/ubuntu/spring-demo/app.pid)
            
            if kill -0 "$PID" 2>/dev/null; then
              echo "Spring Boot application is running"
            else
              echo "Spring Boot application failed to start"
              cat /home/ubuntu/spring-demo/app.log
              exit 1
            fi
        

        # =========================
        # Test deployed API
        # =========================
        - name: Test deployed application
          run: |
            curl --fail http://localhost:8080/api/students/hello
            
            echo ""
            echo "Application deployed successfully!"
